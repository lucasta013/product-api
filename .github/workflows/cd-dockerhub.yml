name: CD - Docker Hub

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI + healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build và khởi động stack
        run: docker compose up -d --build

      - name: Chờ healthcheck
        run: |
          for i in $(seq 1 30); do
            api=$(docker inspect --format='{{.State.Health.Status}}' product-api)
            mongo=$(docker inspect --format='{{.State.Health.Status}}' nammongodb)
            echo "lần $i: api=$api mongo=$mongo"
            if [ "$api" = "healthy" ] && [ "$mongo" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v

  push-image:
    name: Build và push lên Docker Hub
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build và push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}