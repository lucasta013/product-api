name: CD - Docker Hub

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI + healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build và khởi động stack
        run: docker compose up -d --build

      - name: Chờ healthcheck
        run: |
          for i in $(seq 1 30); do
            api=$(docker inspect --format='{{.State.Health.Status}}' product-api)
            mongo=$(docker inspect --format='{{.State.Health.Status}}' nammongodb)
            echo "lần $i: api=$api mongo=$mongo"
            if [ "$api" = "healthy" ] && [ "$mongo" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v

    push-image:
    name: Build và push lên Docker Hub
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret (tạm thời)
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "độ dài username: ${#U}"
          echo "độ dài token: ${#T}"
          echo "token bắt đầu bằng dckr_pat_: $([[ $T == dckr_pat_* ]] && echo yes || echo no)"
          echo "username có khoảng trắng/xuống dòng: $([[ $U =~ [[:space:]] ]] && echo yes || echo no)"
          echo "token có khoảng trắng/xuống dòng: $([[ $T =~ [[:space:]] ]] && echo yes || echo no)"

      - name: Đăng nhập Docker Hub (tự cắt ký tự thừa)
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user=$(printf '%s' "$U" | tr -d '[:space:]')
          printf '%s' "$T" | tr -d '[:space:]' | docker login -u "$user" --password-stdin

      - uses: docker/setup-buildx-action@v3

      - name: Build và push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}