name: Product CI (production-like)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/productdb_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Chạy test (unit + CRUD tích hợp)
        run: npm test

  docker-healthcheck:
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - uses: actions/checkout@v4

      - name: Build và khởi động stack
        run: docker compose up -d --build

      - name: Chờ cả hai service healthy
        run: |
          for i in $(seq 1 30); do
            api=$(docker inspect --format='{{.State.Health.Status}}' product-api)
            mongo=$(docker inspect --format='{{.State.Health.Status}}' nammongodb)
            echo "lần $i: api=$api mongo=$mongo"
            if [ "$api" = "healthy" ] && [ "$mongo" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Smoke test
        run: curl -f http://localhost:3000/ready

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v